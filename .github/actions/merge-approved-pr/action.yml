name: Merge Approved PR
description: 'Merge a PR if it targets the expected branches and has release-team approval.'

inputs:
  pr-number:
    required: true
    description: 'The number of the pull request to process'
  required-base-branch:
    required: true
    description: 'The required base branch name (e.g., main)'
  head-branch-pattern:
    required: true
    description: 'Regex pattern for the required head branch (e.g., ^stable-main-[0-9]+\.[0-9]+\.[0-9]+$)'
  merge-method:
    required: false
    default: 'merge'
    description: "Merge method: 'merge' (merge commit) or 'squash' (squash merge)"
  verify-version-bump:
    required: false
    default: 'false'
    description: >-
      Whether to verify that this PR is purely a version bump. package.json must change its
      "version" field. The Mobile native version fields (versionName in android/app/build.gradle
      and MARKETING_VERSION in ios/MetaMask.xcodeproj/project.pbxproj) may change alongside it,
      to the same version. No other change is allowed.
  github-token:
    required: true
    description: 'GitHub token with permissions to merge'

runs:
  using: composite
  steps:
    # Validate required inputs
    - name: Validate Inputs
      env:
        PR_NUMBER: ${{ inputs.pr-number }}
        REQUIRED_BASE_BRANCH: ${{ inputs.required-base-branch }}
        HEAD_BRANCH_PATTERN: ${{ inputs.head-branch-pattern }}
        MERGE_METHOD: ${{ inputs.merge-method }}
        VERIFY_VERSION_BUMP: ${{ inputs.verify-version-bump }}
      shell: bash
      run: |
        if [[ -z "$PR_NUMBER" ]]; then
          echo "::error::Missing required input: 'pr-number' must be provided."
          exit 1
        fi
        if [[ -z "$REQUIRED_BASE_BRANCH" ]]; then
          echo "::error::Missing required input: 'required-base-branch' must be provided."
          exit 1
        fi
        if [[ -z "$HEAD_BRANCH_PATTERN" ]]; then
          echo "::error::Missing required input: 'head-branch-pattern' must be provided."
          exit 1
        fi
        if [[ "$MERGE_METHOD" != "merge" && "$MERGE_METHOD" != "squash" ]]; then
          echo "::error::Invalid input: 'merge-method' must be either 'merge' or 'squash'. Got '$MERGE_METHOD'."
          exit 1
        fi
        if [[ "$VERIFY_VERSION_BUMP" != "true" && "$VERIFY_VERSION_BUMP" != "false" ]]; then
          echo "::error::Invalid input: 'verify-version-bump' must be either 'true' or 'false'. Got '$VERIFY_VERSION_BUMP'."
          exit 1
        fi
        echo "Inputs validated: pr-number='$PR_NUMBER', required-base-branch='$REQUIRED_BASE_BRANCH', head-branch-pattern='$HEAD_BRANCH_PATTERN', merge-method='$MERGE_METHOD', verify-version-bump='$VERIFY_VERSION_BUMP'"

    # Fetch PR metadata (head and base branches) using the GitHub API
    - name: Get PR Details
      uses: actions/github-script@v9
      env:
        PR_NUMBER: ${{ inputs.pr-number }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          // Fetch full details of the pull request associated with the comment
          const { data: pr } = await github.rest.pulls.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: parseInt(process.env.PR_NUMBER, 10),
          });

          // A head branch in a fork (or a deleted repository) can match the head
          // branch pattern by name, so only accept heads from this repository.
          const baseRepo = `${context.repo.owner}/${context.repo.repo}`;
          const headRepo = pr.head.repo ? pr.head.repo.full_name : null;
          if (headRepo !== baseRepo) {
            core.setFailed(
              `Skipping: PR head must be in '${baseRepo}'. Found '${headRepo ?? 'a deleted repository'}'.`,
            );
            return;
          }

          // Export base/head refs and the head commit for subsequent steps
          core.exportVariable('PR_BASE_REF', pr.base.ref);
          core.exportVariable('PR_HEAD_REF', pr.head.ref);
          core.exportVariable('PR_HEAD_SHA', pr.head.sha);

    # Verify that the PR targets the required base branch from the required head pattern
    - name: Verify Branch Names
      id: verify-branches
      env:
        REQUIRED_BASE_BRANCH: ${{ inputs.required-base-branch }}
        HEAD_BRANCH_PATTERN: ${{ inputs.head-branch-pattern }}
      shell: bash
      run: |
        # Compare actual branches against requirements
        if [[ "$PR_BASE_REF" != "$REQUIRED_BASE_BRANCH" ]] || ! [[ "$PR_HEAD_REF" =~ $HEAD_BRANCH_PATTERN ]]; then
          echo "Skipping: PR must be from '$HEAD_BRANCH_PATTERN' to '$REQUIRED_BASE_BRANCH'. Found $PR_HEAD_REF -> $PR_BASE_REF"
          echo "should_skip=true" >> "$GITHUB_OUTPUT"
        else
          echo "Branches match requirements: Source '$PR_HEAD_REF' -> Target '$PR_BASE_REF'."
          echo "should_skip=false" >> "$GITHUB_OUTPUT"
        fi

    # Check if the PR has the required approval status
    - name: Verify Approval
      if: steps.verify-branches.outputs.should_skip != 'true'
      uses: actions/github-script@v9
      env:
        PR_NUMBER: ${{ inputs.pr-number }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          // Fetch all reviews for the PR
          const reviews = await github.paginate(github.rest.pulls.listReviews, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: parseInt(process.env.PR_NUMBER, 10),
            per_page: 100,
          });
          const headSha = process.env.PR_HEAD_SHA;

          // Fetch members of the release team
          let teamMembers = [];
          try {
            // Note: This requires a token with 'read:org' scope if the team is in an organization.
            // GITHUB_TOKEN typically does not have this scope. Use a PAT if this fails.
            const { data: members } = await github.rest.teams.listMembersInOrg({
              org: context.repo.owner,
              team_slug: 'release-team',
              per_page: 100,
            });
            teamMembers = members.map((m) => m.login);
          } catch (error) {
            // Fallback: If we can't fetch team members (e.g. due to token permissions),
            // we can fail or fallback to author_association.
            // Given the strict requirement for "Release Team", we must fail if we can't verify it.
            console.log(
              `Error fetching release-team members for org '${context.repo.owner}': ${error.message}`,
            );
            console.log('Verify that the token has read:org permissions and the team exists.');
            core.setFailed(`Failed to fetch release-team members: ${error.message}`);
            return;
          }

          // Process reviews to find the latest review for each reviewer
          const latestReviews = {};
          for (const review of reviews) {
            if (review.state === 'APPROVED' || review.state === 'CHANGES_REQUESTED') {
              latestReviews[review.user.login] = review;
            } else if (review.state === 'DISMISSED') {
              delete latestReviews[review.user.login];
            }
          }

          // Check for a release-team approval of the current head commit and no
          // outstanding change requests. An approval of an earlier commit does not
          // cover commits pushed after it.
          const latest = Object.entries(latestReviews);
          const hasTeamApproval = latest.some(
            ([user, review]) =>
              review.state === 'APPROVED' &&
              review.commit_id === headSha &&
              teamMembers.includes(user),
          );
          const hasChangesRequested = latest.some(
            ([, review]) => review.state === 'CHANGES_REQUESTED',
          );

          if (!hasTeamApproval) {
            core.setFailed(
              `Skipping: PR head ${headSha} is not approved by a member of the release-team.`,
            );
          } else if (hasChangesRequested) {
            core.setFailed('Skipping: PR has changes requested.');
          } else {
            console.log('PR approval check passed.');
          }

    # If verify-version-bump is true, then verify that
    # - package.json changes, and every changed file is a known version file
    # - every changed line is that file's version line
    # - every file moves from the same old version to the same new version
    # - the version change is a valid semver bump
    - name: Verify a version bump
      if: ${{ steps.verify-branches.outputs.should_skip != 'true' && inputs.verify-version-bump == 'true' }}
      uses: actions/github-script@v9
      env:
        PR_NUMBER: ${{ inputs.pr-number }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const files = await github.paginate(github.rest.pulls.listFiles, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: parseInt(process.env.PR_NUMBER, 10),
            per_page: 100,
          });

          // The version line of each file a version bump may change. package.json is
          // required; the Mobile native version fields are optional.
          const versionLines = {
            'package.json': /^\s*"version"\s*:\s*"(\d+\.\d+\.\d+)",?\s*$/,
            'android/app/build.gradle': /^\s*versionName\s+"(\d+\.\d+\.\d+)"\s*$/,
            'ios/MetaMask.xcodeproj/project.pbxproj': /^\s*MARKETING_VERSION\s*=\s*(\d+\.\d+\.\d+);\s*$/,
          };

          if (!files.some((file) => file.filename === 'package.json')) {
            core.setFailed('Validation failed: a version bump must change package.json.');
            return;
          }

          const oldVersions = new Set();
          const newVersions = new Set();
          for (const file of files) {
            const versionLine = versionLines[file.filename];
            if (!versionLine || file.status !== 'modified') {
              core.setFailed(
                `Validation failed: ${file.filename} (${file.status}) is not a version file. A version bump may only modify ${Object.keys(versionLines).join(', ')}.`,
              );
              return;
            }
            if (!file.patch) {
              // If GitHub omitted the patch (e.g., too large), don't emit the flag.
              core.setFailed(
                `Validation failed: Unable to retrieve the ${file.filename} patch to verify the version bump.`,
              );
              return;
            }

            const changedLines = file.patch
              .split('\n')
              .filter((line) => line.startsWith('+') || line.startsWith('-'))
              .filter((line) => !line.startsWith('+++') && !line.startsWith('---'));
            const removed = changedLines.filter((line) => line.startsWith('-'));
            const added = changedLines.filter((line) => line.startsWith('+'));
            if (removed.length === 0 || removed.length !== added.length) {
              core.setFailed(
                `Validation failed: ${file.filename} must replace each version line it changes (one removal, one addition).`,
              );
              return;
            }

            for (const line of changedLines) {
              const match = line.slice(1).match(versionLine);
              if (!match) {
                core.setFailed(
                  `Validation failed: ${file.filename} changes a line other than its MAJOR.MINOR.PATCH version line.`,
                );
                return;
              }
              (line.startsWith('-') ? oldVersions : newVersions).add(match[1]);
            }
          }

          if (oldVersions.size !== 1 || newVersions.size !== 1) {
            core.setFailed(
              `Validation failed: every version file must move from the same version to the same version. Found ${[...oldVersions].join(', ')} -> ${[...newVersions].join(', ')}.`,
            );
            return;
          }

          const [oldVersion] = oldVersions;
          const [newVersion] = newVersions;
          if (oldVersion === newVersion) {
            core.setFailed(
              'Validation failed: package.json version must change (format-only edits are not allowed).',
            );
            return;
          }

          const [oldMajor, oldMinor, oldPatch] = oldVersion.split('.').map((n) => parseInt(n, 10));
          const [newMajor, newMinor, newPatch] = newVersion.split('.').map((n) => parseInt(n, 10));

          const isMajorBump = newMajor === oldMajor + 1 && newMinor === 0 && newPatch === 0;
          const isMinorBump = newMajor === oldMajor && newMinor === oldMinor + 1 && newPatch === 0;
          const isPatchBump = newMajor === oldMajor && newMinor === oldMinor && newPatch === oldPatch + 1;

          if (isMajorBump || isMinorBump || isPatchBump) {
            console.log(
              `Only version lines changed (${files.map((file) => file.filename).join(', ')}), with a valid semver bump (${oldVersion} -> ${newVersion}).`,
            );
          } else {
            core.setFailed(
              'Validation failed: version must bump by exactly +1 major (reset to .0.0), +1 minor (reset patch to .0), or +1 patch.',
            );
          }

    # Execute the merge if all checks pass
    - name: Merge PR
      if: steps.verify-branches.outputs.should_skip != 'true'
      uses: actions/github-script@v9
      env:
        PR_NUMBER: ${{ inputs.pr-number }}
        MERGE_METHOD: ${{ inputs.merge-method }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          try {
            // Perform the merge using the requested method ('merge' or 'squash').
            // `sha` makes GitHub refuse the merge if the head moved after the checks above.
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: parseInt(process.env.PR_NUMBER, 10),
              merge_method: process.env.MERGE_METHOD,
              sha: process.env.PR_HEAD_SHA,
            });
            console.log(
              `PR merged successfully: Source '${process.env.PR_HEAD_REF}' -> Target '${process.env.PR_BASE_REF}'.`,
            );
          } catch (error) {
            core.setFailed(`Merge failed: ${error.message}`);
          }
