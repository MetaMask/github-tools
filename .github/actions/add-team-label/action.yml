name: Add Team Label
description: "Adds a GitHub team label to a pull request based on the author's entry in the MetaMask topology file. Skips if the PR already has a team-* or external-contributor label."

inputs:
  team-label-token:
    description: 'GitHub token with access to read topology.json and add labels to PRs.'
    required: true

  planning-token:
    description: 'GitHub token with access to read topology.json. Optional if team-label-token already has this access.'
    required: false

runs:
  using: composite
  steps:
    # Prefer a manually applied team label (or external-contributor) over topology lookup.
    - name: Check for existing team label
      id: check-existing-label
      env:
        GH_TOKEN: ${{ inputs.team-label-token }}
        PULL_REQUEST_URL: ${{ github.event.pull_request.html_url }}
      shell: bash
      run: |
        existing=$(gh pr view "$PULL_REQUEST_URL" --json labels --jq '[.labels[].name] | map(select(startswith("team-") or . == "external-contributor")) | .[0] // empty')
        if [ -n "$existing" ]; then
          echo "PR already has team label: $existing — skipping topology assignment"
          echo "SKIP=true" >> "$GITHUB_OUTPUT"
        else
          echo "No existing team label — assigning from topology"
          echo "SKIP=false" >> "$GITHUB_OUTPUT"
        fi

    # Fetch the team label for the PR author from topology.json and expose it as a step output.
    - name: Get team label
      id: get-team-label
      if: ${{ steps.check-existing-label.outputs.SKIP != 'true' }}
      env:
        GH_TOKEN: ${{ inputs.planning-token || inputs.team-label-token }}
        USER: ${{ github.event.pull_request.user.login }}
      shell: bash
      run: |
        # Stream topology.json through jq, find the first team where USER appears in members, pm, em, or tl, and emit
        # its githubLabel.name value.
        team_label=$(gh api -H 'Accept: application/vnd.github.raw' 'repos/metamask/metamask-planning/contents/topology.json' | jq -r --arg USER "$USER" '.[] | select(any(.members[]?; . == $USER) or (.pm // empty) == $USER or (.em // empty) == $USER or (.tl // empty) == $USER) | .githubLabel.name' | head -n 1)
        if [ -z "$team_label" ]; then
          echo "::error::Team label not found for author: $USER. Please open a pull request with your GitHub handle and team label to update topology.json at https://github.com/MetaMask/MetaMask-planning/blob/main/topology.json"
          exit 1
        fi
        echo "TEAM_LABEL=$team_label" >> "$GITHUB_OUTPUT"

    # Apply the retrieved label to the pull request using the GitHub CLI.
    - name: Add team label
      if: ${{ steps.check-existing-label.outputs.SKIP != 'true' }}
      env:
        GH_TOKEN: ${{ inputs.team-label-token }}
        PULL_REQUEST_URL: ${{ github.event.pull_request.html_url }}
        TEAM_LABEL: ${{ steps.get-team-label.outputs.TEAM_LABEL }}
      shell: bash
      run: |
        gh issue edit "$PULL_REQUEST_URL" --add-label "$TEAM_LABEL"
