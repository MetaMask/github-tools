name: Update Release Changelog
description: 'Update the release changelog for a given release branch.'

inputs:
  release-branch:
    required: true
    description: 'Release branch name (e.g., Version-v13.3.0 or release/6.20.0).'
  platform:
    required: false
    default: 'extension'
    description: 'Target platform (extension | mobile). Defaults to extension.'
  repository-url:
    required: true
    description: 'Full HTTPS URL for the invoking repository.'
  previous-version-ref:
    required: false
    default: 'null'
    description: 'Previous release version reference (branch/tag/SHA). Use "null" for hotfixes.'
  github-token:
    required: true
    description: 'GitHub token with write access to the invoking repository and read access to planning resources.'
  auto-changelog-repository:
    required: false
    description: 'Temporary source repository for auto-changelog while unreleased behavior is required.'
    default: 'MetaMask/auto-changelog'
  auto-changelog-ref:
    required: false
    description: 'Immutable auto-changelog commit SHA used by the temporary source CLI.'
    default: '7bbff6b64971d5a12137949b4ac2363b5cd071ef'
runs:
  using: composite
  steps:
    # Step 1: Checkout invoking repository (metamask-mobile | metamask-extension)
    - name: Checkout invoking repository
      uses: actions/checkout@v6
      env:
        AI_ANALYZER_LITELLM_KEY: ''
      with:
        fetch-depth: 0
        ref: ${{ inputs.release-branch }}
        token: ${{ inputs.github-token }}

    # Temporary source checkout until the required auto-changelog behavior is
    # released and both consumers update their packaged dependency.
    - name: Checkout auto-changelog source
      uses: actions/checkout@v6
      env:
        AI_ANALYZER_LITELLM_KEY: ''
      with:
        repository: ${{ inputs.auto-changelog-repository }}
        ref: ${{ inputs.auto-changelog-ref }}
        path: ./auto-changelog

    # Step 3: Setup environment
    - name: Checkout and setup environment
      uses: MetaMask/action-checkout-and-setup@v3
      env:
        AI_ANALYZER_LITELLM_KEY: ''
      with:
        is-high-risk-environment: true

    - name: Set up Node 24 for release changelog automation
      uses: actions/setup-node@v6
      env:
        AI_ANALYZER_LITELLM_KEY: ''
      with:
        node-version: '24'

    - name: Build auto-changelog source
      shell: bash
      env:
        AI_ANALYZER_LITELLM_KEY: ''
      run: |
        set -euo pipefail
        corepack enable
        corepack yarn --cwd ./auto-changelog install --immutable
        corepack yarn --cwd ./auto-changelog build

    - name: Update changelog branch
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GIT_AUTHOR_NAME: metamaskbot
        GIT_AUTHOR_EMAIL: metamaskbot@users.noreply.github.com
        RELEASE_BRANCH: ${{ inputs.release-branch }}
        PLATFORM: ${{ inputs.platform }}
        REPOSITORY_URL: ${{ inputs.repository-url }}
        PREVIOUS_VERSION_REF: ${{ inputs.previous-version-ref }}
        AUTO_CHANGELOG_CLI: ${{ github.workspace }}/auto-changelog/dist/cli.mjs
      run: |
        set -euo pipefail

        node "$GITHUB_ACTION_PATH/../../scripts/update-release-changelog.mts" \
          "$RELEASE_BRANCH" \
          "$PLATFORM" \
          "$REPOSITORY_URL" \
          "$PREVIOUS_VERSION_REF"

    - name: Upload clean-room proofread report
      if: ${{ always() && hashFiles('.tmp/release-changelog-ai/*.json') != '' }}
      uses: actions/upload-artifact@v7
      env:
        AI_ANALYZER_LITELLM_KEY: ''
      with:
        name: release-changelog-ai-report
        path: .tmp/release-changelog-ai/*.json
        if-no-files-found: ignore
