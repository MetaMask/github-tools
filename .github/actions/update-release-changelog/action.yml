name: Update Release Changelog
description: 'Update the release changelog for a given release branch.'

inputs:
  release-branch:
    required: true
    description: 'Release branch name (e.g., Version-v13.3.0 or release/6.20.0).'
  platform:
    required: false
    default: 'extension'
    description: 'Target platform (extension | mobile). Defaults to extension.'
  repository-url:
    required: true
    description: 'Full HTTPS URL for the invoking repository.'
  previous-version-ref:
    required: false
    default: 'null'
    description: 'Previous release version reference (branch/tag/SHA). Use "null" for hotfixes.'
  github-token:
    required: true
    description: 'GitHub token with write access to the invoking repository and read access to planning resources.'
  auto-changelog-repository:
    required: false
    description: 'TEMPORARY: source repository for auto-changelog. Remove with the source checkout/build steps once a released auto-changelog has the required behavior.'
    default: 'MetaMask/auto-changelog'
  auto-changelog-ref:
    required: false
    description: 'TEMPORARY: immutable auto-changelog commit SHA built from source. Remove once a released auto-changelog is used.'
    default: '7bbff6b64971d5a12137949b4ac2363b5cd071ef'
runs:
  using: composite
  steps:
    # Step 1: Checkout invoking repository (metamask-mobile | metamask-extension)
    - name: Checkout invoking repository
      uses: actions/checkout@v6
      env:
        AI_ANALYZER_LITELLM_KEY: ''
      with:
        fetch-depth: 0
        ref: ${{ inputs.release-branch }}
        token: ${{ inputs.github-token }}

    # TEMPORARY (1/3): the pinned auto-changelog commit includes fixes (e.g.
    # 2c6add7 after v6.2.1) that no release has yet. Once it is released,
    # remove this step, the build step below, the two
    # `auto-changelog-*` inputs and `AUTO_CHANGELOG_CLI` in the update step,
    # and run the released CLI (pinned version) instead.
    - name: Checkout auto-changelog source
      uses: actions/checkout@v6
      env:
        AI_ANALYZER_LITELLM_KEY: ''
      with:
        repository: ${{ inputs.auto-changelog-repository }}
        ref: ${{ inputs.auto-changelog-ref }}
        path: ./auto-changelog

    - name: Set up Node 24 for release changelog automation
      uses: actions/setup-node@v6
      env:
        AI_ANALYZER_LITELLM_KEY: ''
      with:
        node-version: '24'

    # TEMPORARY (2/3): builds the source checkout above; delete with it.
    # Corepack resolves Yarn from the working directory, not from `--cwd`, so
    # the build must run inside the checkout to use its own pinned Yarn.
    - name: Build auto-changelog source
      shell: bash
      working-directory: ./auto-changelog
      env:
        AI_ANALYZER_LITELLM_KEY: ''
      run: |
        set -euo pipefail
        corepack enable
        corepack yarn install --immutable
        corepack yarn build

    - name: Update changelog branch
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GIT_AUTHOR_NAME: metamaskbot
        GIT_AUTHOR_EMAIL: metamaskbot@users.noreply.github.com
        RELEASE_BRANCH: ${{ inputs.release-branch }}
        PLATFORM: ${{ inputs.platform }}
        REPOSITORY_URL: ${{ inputs.repository-url }}
        PREVIOUS_VERSION_REF: ${{ inputs.previous-version-ref }}
        # TEMPORARY (3/3): points the runner at the source-built CLI; delete with it.
        AUTO_CHANGELOG_CLI: ${{ github.workspace }}/auto-changelog/dist/cli.mjs
      run: |
        set -euo pipefail

        node "$GITHUB_ACTION_PATH/../../scripts/update-release-changelog.mts" \
          "$RELEASE_BRANCH" \
          "$PLATFORM" \
          "$REPOSITORY_URL" \
          "$PREVIOUS_VERSION_REF"

    - name: Upload clean-room proofread report
      if: ${{ always() && hashFiles('.tmp/release-changelog-ai/*.json') != '' }}
      uses: actions/upload-artifact@v7
      env:
        AI_ANALYZER_LITELLM_KEY: ''
      with:
        name: release-changelog-ai-report
        path: .tmp/release-changelog-ai/*.json
        if-no-files-found: ignore
